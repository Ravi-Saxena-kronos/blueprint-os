{% extends "base.html" %}
{% block title %}Voice intake{% endblock %}
{% block body %}
<h1>Voice intake</h1>
<p class="note">Speak your answers. We use AssemblyAI for transcription and the same blueprint pipeline as the form.</p>

<div class="deliverable-card">
  <p id="agent-text">{{ welcome }}</p>
  <div class="voice-controls">
    <button type="button" class="btn" id="record-btn">Hold to speak</button>
    <button type="button" class="btn warn" id="submit-btn" disabled>Submit blueprint</button>
  </div>
  <p class="note" id="status-line">Microphone permission required.</p>
  <label class="note">Or type: <input type="text" id="text-fallback" placeholder="Type answer and press Enter" /></label>
</div>

<script>
const agentEl = document.getElementById('agent-text');
const statusEl = document.getElementById('status-line');
const submitBtn = document.getElementById('submit-btn');
const recordBtn = document.getElementById('record-btn');
const textFallback = document.getElementById('text-fallback');

function speak(text) {
  if (!window.speechSynthesis || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function postTurn(transcript) {
  const r = await fetch('/voice/turn', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text: transcript }),
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function handleTranscript(text) {
  statusEl.textContent = 'Thinking…';
  const data = await postTurn(text);
  agentEl.textContent = data.reply;
  speak(data.reply);
  submitBtn.disabled = !data.ready;
  statusEl.textContent = data.ready ? 'Ready to submit.' : 'Continue when ready.';
}

textFallback.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const t = textFallback.value.trim();
  if (!t) return;
  textFallback.value = '';
  try { await handleTranscript(t); } catch (err) { statusEl.textContent = err.message; }
});

let mediaRecorder, chunks = [];
async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(chunks, { type: 'audio/webm' });
    statusEl.textContent = 'Transcribing…';
    const fd = new FormData();
    fd.append('audio', blob, 'clip.webm');
    const tr = await fetch('/voice/transcribe', { method: 'POST', body: fd });
    if (!tr.ok) throw new Error(await tr.text());
    const { text } = await tr.json();
    if (!text) { statusEl.textContent = 'No speech detected.'; return; }
    await handleTranscript(text);
  };
  mediaRecorder.start();
  statusEl.textContent = 'Listening…';
}

function stopRec() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

recordBtn.addEventListener('mousedown', () => startRec().catch((e) => { statusEl.textContent = e.message; }));
recordBtn.addEventListener('mouseup', stopRec);
recordBtn.addEventListener('mouseleave', stopRec);
recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRec().catch((err) => { statusEl.textContent = err.message; }); });
recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRec(); });

submitBtn.addEventListener('click', async () => {
  statusEl.textContent = 'Submitting…';
  const r = await fetch('/voice/submit', { method: 'POST' });
  if (!r.ok) { statusEl.textContent = await r.text(); return; }
  const data = await r.json();
  window.location.href = data.redirect;
});

const WELCOME = {{ welcome|tojson }};
speak(WELCOME);
</script>
{% endblock %}
